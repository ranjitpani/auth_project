<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --glass-bg: rgba(255, 255, 255, 0.12);
        --glass-border: rgba(255, 255, 255, 0.25);
        --primary-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        --accent: #ffffff;
    }

    body {
        background: #0f172a; /* Dark sleek background */
        background-image: 
            radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.33) 0, transparent 50%), 
            radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.33) 0, transparent 50%);
        font-family: 'Poppins', sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
    }

    .form-container {
        width: 90%;
        max-width: 420px;
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 30px;
        padding: 40px 30px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        animation: floatIn 1s ease-out;
    }

    h2 {
        text-align: center;
        color: white;
        font-size: 28px;
        font-weight: 700;
        margin-top: 0;
        margin-bottom: 30px;
        letter-spacing: -0.5px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    .input-group {
        position: relative;
        margin-bottom: 20px;
    }

    /* Stylish Inputs */
    input {
        width: 100%;
        height: 58px;
        padding: 0 20px;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        color: white;
        box-sizing: border-box;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input::placeholder {
        color: rgba(255, 255, 255, 0.5);
        font-weight: 300;
    }

    input:focus {
        background: rgba(255, 255, 255, 0.15);
        border-color: #00f2fe;
        outline: none;
        box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        transform: translateY(-2px);
    }

    label {
        display: block;
        color: #94a3b8;
        font-size: 13px;
        margin-left: 5px;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Premium Button */
    button {
        width: 100%;
        height: 60px;
        background: var(--primary-gradient);
        color: #003366;
        border: none;
        border-radius: 18px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 15px;
        box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    button:hover {
        transform: scale(1.02);
        box-shadow: 0 15px 25px rgba(0, 242, 254, 0.4);
    }

    button:active {
        transform: scale(0.97);
    }

    /* Subtle Shine Animation on Button */
    button::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: rgba(255,255,255,0.2);
        transform: rotate(45deg);
        transition: 0.5s;
        pointer-events: none;
    }

    /* Entrance Animation */
    @keyframes floatIn {
        0% { opacity: 0; transform: translateY(40px) scale(0.9); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Custom style for Time Input icon */
    input[type="time"]::-webkit-calendar-picker-indicator {
        filter: invert(1);
        cursor: pointer;
    }

</style>

<div class="form-container">
    <h2>Add Bus Details</h2>
    <form method="post">
        {% csrf_token %}
        <div class="input-group">
            <input name="bus_name" placeholder="🚌  Bus Name" required>
        </div>
        <div class="input-group">
            <input name="number_plate" placeholder="🔢  Number Plate" required>
        </div>
        <div class="input-group">
            <input name="mobile_number" placeholder="📞  Mobile Number" type="tel">
        </div>
        <div class="input-group">
            <input name="route_district" placeholder="📍  District">
        </div>
        <div class="input-group">
            <input name="route_block" placeholder="🏢  Block">
        </div>
        <div class="input-group">
            <label>🕒 Arrival Time</label>
            <input type="time" name="arrival_time">
        </div>

        <button type="submit">SAVE BUS</button>
    </form>
</div>
