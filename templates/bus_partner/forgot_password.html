<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
    :root {
        --primary-blue: #4f46e5;
        --error-red: #ef4444;
        --bg-light: #f8fafc;
    }

    body {
        background: var(--bg-light);
        background-image: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
        font-family: 'Poppins', sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .forgot-card {
        width: 100%;
        max-width: 400px;
        background: #ffffff;
        border-radius: 24px;
        padding: 40px 30px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        text-align: center;
        animation: fadeIn 0.6s ease-out;
    }

    .icon-box {
        width: 70px;
        height: 70px;
        background: rgba(79, 70, 229, 0.1);
        color: var(--primary-blue);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
        margin: 0 auto 20px;
    }

    h2 {
        color: #1e293b;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 10px;
    }

    p.instruction {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 25px;
        line-height: 1.5;
    }

    .error-msg {
        background: #fee2e2;
        color: var(--error-red);
        padding: 12px;
        border-radius: 12px;
        font-size: 13px;
        margin-bottom: 20px;
        border: 1px solid rgba(239, 68, 68, 0.2);
    }

    /* Input Styling */
    .input-wrapper {
        position: relative;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        height: 55px;
        padding: 0 20px;
        font-size: 16px;
        border: 2px solid #e2e8f0;
        border-radius: 15px;
        box-sizing: border-box;
        transition: all 0.3s ease;
        background: #f1f5f9;
        outline: none;
    }

    input:focus {
        border-color: var(--primary-blue);
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    /* Button Styling */
    button {
        width: 100%;
        height: 55px;
        background: var(--primary-blue);
        color: white;
        border: none;
        border-radius: 15px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4);
    }

    button:hover {
        background: #4338ca;
        transform: translateY(-2px);
    }

    button:active {
        transform: scale(0.98);
    }

    .back-login {
        margin-top: 25px;
        display: block;
        color: #64748b;
        font-size: 14px;
        text-decoration: none;
        transition: 0.3s;
    }

    .back-login:hover {
        color: var(--primary-blue);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="forgot-card">
    <div class="icon-box">🔑</div>
    <h2>Forgot Password?</h2>
    <p class="instruction">No worries! Enter your registered email below and we will send you an OTP.</p>

    {% if error %}
        <div class="error-msg">⚠️ {{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="input-wrapper">
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>
        
        <button type="submit">Send OTP</button>
    </form>

    <a href="/login" class="back-login">← Back to Login</a>
</div>
