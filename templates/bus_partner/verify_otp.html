<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --primary-glow: #6366f1;
        --secondary-glow: #06b6d4;
        --bg-dark: #0f172a;
        --glass-bg: rgba(255, 255, 255, 0.05);
        --error-red: #f87171;
    }

    body {
        background: var(--bg-dark);
        background-image: 
            radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
        font-family: 'Outfit', sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: white;
        padding: 20px;
    }

    .otp-card {
        width: 100%;
        max-width: 400px;
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 32px;
        padding: 40px 30px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        text-align: center;
        animation: slideIn 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .icon-box {
        font-size: 50px;
        margin-bottom: 20px;
        filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.3));
    }

    h2 {
        font-size: 26px;
        font-weight: 700;
        margin: 0 0 10px 0;
        letter-spacing: -0.5px;
    }

    p.subtitle {
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 30px;
        line-height: 1.5;
    }

    /* Error Message */
    .error-alert {
        background: rgba(248, 113, 113, 0.1);
        color: var(--error-red);
        padding: 12px;
        border-radius: 12px;
        font-size: 14px;
        margin-bottom: 20px;
        border: 1px solid rgba(248, 113, 113, 0.2);
        animation: shake 0.4s linear;
    }

    /* OTP Input Styling */
    .input-group {
        margin-bottom: 25px;
    }

    input[name="otp"] {
        width: 100%;
        height: 65px;
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        color: #00ffcc;
        letter-spacing: 8px;
        transition: all 0.3s ease;
        outline: none;
    }

    input[name="otp"]:focus {
        border-color: var(--primary-glow);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
    }

    input[name="otp"]::placeholder {
        letter-spacing: normal;
        font-size: 16px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.2);
    }

    /* Premium Button */
    button {
        width: 100%;
        height: 58px;
        background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
        color: white;
        border: none;
        border-radius: 18px;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.4s ease;
        box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4);
    }

    button:active {
        transform: scale(0.97);
    }

    /* Animations */
    @keyframes slideIn {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
    }
</style>

<div class="otp-card">
    <div class="icon-box">📲</div>
    <h2>Verify OTP</h2>
    <p class="subtitle">Enter the 6-digit verification code sent to your email.</p>

    {% if error %}
        <div class="error-alert">
            <span>⚠️ {{ error }}</span>
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="input-group">
            <input type="text" name="otp" placeholder="000000" maxlength="6" required autocomplete="one-time-code">
        </div>

        <button type="submit">Verify & Continue</button>
    </form>

    <p style="margin-top: 25px; font-size: 13px; color: #64748b;">
        Didn't receive the code? <a href="#" style="color: var(--secondary-glow); text-decoration: none; font-weight: 600;">Resend OTP</a>
    </p>
</div>
