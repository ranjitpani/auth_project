<!DOCTYPE html>
<html>
<head>
    <title>Bus Partner Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #06b6d4;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            /* Animated Background Glows */
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px;
            border-radius: 30px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: white;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            height: 55px;
            padding: 0 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.2);
            transform: translateY(-2px);
        }

        .login-btn {
            width: 100%;
            height: 55px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 30px rgba(79, 70, 229, 0.4);
            letter-spacing: 0.5px;
        }

        .links {
            margin-top: 25px;
            text-align: center;
        }

        .links a {
            text-decoration: none;
            font-size: 14px;
            color: #94a3b8;
            transition: 0.3s;
        }

        .links a:hover {
            color: white;
        }

        .signup-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .signup-btn {
            background: transparent;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .signup-btn:hover {
            background: rgba(6, 182, 212, 0.1);
            transform: translateY(-2px);
        }

        .error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .login-card {
                width: 88%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Partner Login</h2>

    {% if error %}
        <p class="error">⚠️ {{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="input-group">
            <input name="email" type="email" placeholder="Email Address" required>
        </div>
        <div class="input-group">
            <input name="password" type="password" placeholder="Password" required>
        </div>
        <button type="submit" class="login-btn">Login to Dashboard</button>
    </form>

    <div class="links">
        <a href="/bus/forgot-password/">Forgot your password?</a>
        
        <div class="signup-section">
            <p style="color: #64748b; font-size: 13px; margin-bottom: 15px;">Don't have an account?</p>
            <a href="/bus/signup/">
                <button class="signup-btn">Create New Account</button>
            </a>
        </div>
    </div>
</div>

</body>
</html>
