<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Village Store{% endblock %}</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            padding-bottom: 70px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #ddd;
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: #555;
            font-size: 12px;
            text-decoration: none;
        }
        .nav-item i {
            font-size: 20px;
            display: block;
            margin-bottom: 3px;
        }
        .nav-item.active,
        .nav-item:hover {
            color: #0d6efd;
        }
     /* ===== GLOBAL SEARCH BAR PREMIUM DESIGN ===== */

.global-search-bar{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 12px 15px;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.85);
    z-index: 9999;
    transition: all .3s ease;
}

.search-container{
    max-width: 600px;
    margin: auto;
    position: relative;
}

.search-container input{
    width: 100%;
    padding: 12px 45px 12px 18px;
    border-radius: 50px;
    border: 1px solid #ddd;
    outline: none;
    font-size: 14px;
    background: #fff;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    transition: all .3s ease;
}

/* Focus Animation */
.search-container input:focus{
    border-color: #0d6efd;
    box-shadow: 0 6px 20px rgba(13,110,253,.3);
    transform: scale(1.03);
}

/* Search Icon */
.search-container i{
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #888;
    font-size: 16px;
    pointer-events: none;
}

/* Scroll Shrink Effect */
.global-search-bar.shrink{
    padding: 6px 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

/* Mobile Responsive */
@media (max-width: 600px){
    .search-container input{
        font-size: 13px;
        padding: 10px 40px 10px 15px;
    }
}


        @media (min-width: 768px) {
            .bottom-nav {
                width: 400px;
                left: 50%;
                transform: translateX(-50%);
                border-radius: 15px 15px 0 0;
            }
        }
    </style>
</head>
<body>
    

<!-- GLOBAL STICKY SEARCH BAR -->
{% block global_search %}
<div class="global-search-bar" id="globalSearchBar">
    <div class="search-container">
        <form method="get" action="{% url 'search_products' %}">
            <input type="text" name="product_q" placeholder="Search products...">
            <i class="fa fa-search"></i>
        </form>
    </div>
</div>

{% endblock %}


{% block content %}{% endblock %}

<!-- Bottom Navbar -->
<div class="bottom-nav">

    <a href="{% url 'home' %}" class="nav-item {% if request.path == '/' %}active{% endif %}">
        <i class="fa fa-home"></i>
        Home
    </a>

    <a href="/cart/" class="nav-item {% if 'cart' in request.path %}active{% endif %}">
        <i class="fa fa-shopping-cart"></i>
        Cart
    </a>

    <a href="/cart-history/" class="nav-item {% if 'history' in request.path %}active{% endif %}">
        <i class="fa fa-clock"></i>
        History
    </a>

    <!-- <a href="/location/" class="nav-item {% if 'location' in request.path %}active{% endif %}">
        <i class="fa fa-location-dot"></i>
        Location
    </a> -->
    <!-- ✅ Wishlist Button -->
    <a href="/wishlist/" class="nav-item {% if 'wishlist' in request.path %}active{% endif %}">
        <i class="fa fa-heart"></i>
        Wishlist
    </a>

    {% if request.user.is_authenticated %}
        <a href="/profile/" class="nav-item {% if 'profile' in request.path %}active{% endif %}">
            <i class="fa fa-user"></i>
            Profile
        </a>
    {% else %}
        <a href="{% url 'login' %}" class="nav-item {% if 'login' in request.path %}active{% endif %}">
            <i class="fa fa-user"></i>
            Login
        </a>
    {% endif %}

</div>
{% if messages %}
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}

<script>
window.addEventListener("scroll", function(){
    const searchBar = document.getElementById("globalSearchBar");

    if(window.scrollY > 50){
        searchBar.classList.add("shrink");
    } else {
        searchBar.classList.remove("shrink");
    }
});
</script>

</body>
</html>
