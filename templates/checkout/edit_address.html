{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Delivery Address</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2ff;font-family:system-ui,sans-serif;}
.form-box{padding:20px;background:#fff;min-height:100vh;}
@media(min-width:768px){
  .form-box{max-width:420px;margin:30px auto;border-radius:18px;box-shadow:0 15px 35px rgba(0,0,0,.1);}
}

.input-group{position:relative;margin-bottom:14px;}
.input-group i{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#64748b;
}
.input-group input,
.input-group textarea{
  width:100%;
  padding:16px 16px 16px 44px;
  border-radius:14px;
  border:1px solid #e5e7eb;
  background:#f9fafb;
  font-size:15px;
}
.input-group textarea{height:100px;padding-top:16px;}

.row{display:flex;gap:10px}
.row .input-group{flex:1}

.btn{width:100%;padding:16px;border:none;border-radius:18px;font-size:16px;font-weight:800;}
.btn-primary{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;}
.btn-location{background:#eef2ff;border:2px dashed #c7d2fe;color:#1e40af;margin-bottom:12px;}

.map-box{height:260px;border-radius:16px;overflow:hidden;margin-bottom:12px;}
.note{font-size:12px;color:#64748b;margin-bottom:10px;}
.search-wrap{display:flex;gap:8px;margin-bottom:10px;}
.search-wrap input{flex:1;padding:14px;border-radius:14px;border:1px solid #e5e7eb;}
.search-wrap button{padding:0 18px;border:none;border-radius:14px;background:#2563eb;color:#fff;font-weight:700;}
</style>
</head>

<body>

{% include "checkout/steps.html" with step=1 %}

<form method="post" class="form-box">
{% csrf_token %}

<div class="input-group">
<i class="fa fa-user"></i>
<input name="name" value="{{ address.name }}" placeholder="Full Name" required>
</div>

<div class="input-group">
<i class="fa fa-phone"></i>
<input name="mobile" value="{{ address.mobile }}" placeholder="Mobile Number" required maxlength="10">
</div>

<div class="input-group">
<i class="fa fa-phone-volume"></i>
<input name="alt_mobile" value="{{ address.alt_mobile }}" placeholder="Alternate Mobile">
</div>

<div class="input-group">
<i class="fa fa-location-dot"></i>
<input name="pincode" id="pincode" value="{{ address.pincode }}" placeholder="Pincode" required>
</div>

<div class="row">
  <div class="input-group">
    <i class="fa fa-map"></i>
    <input name="state" id="state" value="{{ address.state }}" placeholder="State">
  </div>
  <div class="input-group">
    <i class="fa fa-map-pin"></i>
    <input name="district" id="district" value="{{ address.district }}" placeholder="District">
  </div>
</div>

<div class="input-group">
<i class="fa fa-city"></i>
<input name="block" id="block" value="{{ address.block }}" placeholder="Block">
</div>

<div class="input-group">
<i class="fa fa-tree"></i>
<input name="village" id="village" value="{{ address.village }}" placeholder="Village">
</div>

<div class="input-group">
<i class="fa fa-home"></i>
<input name="room_no" value="{{ address.room_no }}" placeholder="House / Room No">
</div>

<div class="input-group">
<i class="fa fa-road"></i>
<textarea name="address" id="address" required>{{ address.address }}</textarea>
</div>

<input type="hidden" name="latitude" id="lat" value="{{ address.latitude }}">
<input type="hidden" name="longitude" id="lng" value="{{ address.longitude }}">
<!-- 
<p class="note">🔍 Search / tap map / current location</p>

<div class="search-wrap">
<input type="text" id="searchBox" placeholder="Search village, city, landmark">
<button type="button" onclick="searchLocation()">Search</button>
</div>

<div class="map-box" id="map"></div>

<button type="button" class="btn btn-location" onclick="useMyLocation()">
📍 Use My Current Location
</button> -->

<button type="submit" class="btn btn-primary">
Update Address →
</button>

</form>

<script>
let map, marker;

const latInput=document.getElementById("lat");
const lngInput=document.getElementById("lng");
const pincode=document.getElementById("pincode");
const state=document.getElementById("state");
const district=document.getElementById("district");
const block=document.getElementById("block");
const village=document.getElementById("village");

/* INIT MAP */
document.addEventListener("DOMContentLoaded",()=>{
  const lat=parseFloat(latInput.value)||20.5937;
  const lng=parseFloat(lngInput.value)||78.9629;
  const zoom=(latInput.value && lngInput.value)?16:5;

  map=L.map("map").setView([lat,lng],zoom);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
  marker=L.marker([lat,lng],{draggable:true}).addTo(map);

  map.on("click",e=>{
    marker.setLatLng(e.latlng);
    setLatLng(e.latlng.lat,e.latlng.lng);
    reverseGeocodeFull(e.latlng.lat,e.latlng.lng);
  });

  marker.on("dragend",()=>{
    const p=marker.getLatLng();
    setLatLng(p.lat,p.lng);
    reverseGeocodeFull(p.lat,p.lng);
  });
});

/* SET LAT LNG */
function setLatLng(lat,lng){
  latInput.value=lat.toFixed(6);
  lngInput.value=lng.toFixed(6);
}

/* PINCODE AUTO FILL */
pincode.addEventListener("blur",()=>{
  const pin=pincode.value.trim();
  if(!pin || pin.length<6) return;

  fetch(`https://api.postalpincode.in/pincode/${pin}`)
  .then(res=>res.json())
  .then(data=>{
    if(data[0].Status!=="Success") return;
    const post=data[0].PostOffice[0];
    state.value=post.State||"";
    district.value=post.District||"";
    block.value=post.Block||"";
    village.value=post.Name||"";
  });
});

/* CURRENT LOCATION → ONLY ADDRESS FILL */
function useMyLocation(){
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;
    map.setView([lat,lng],16);
    marker.setLatLng([lat,lng]);
    setLatLng(lat,lng);

    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
    .then(r=>r.json())
    .then(d=>{
      if(d.display_name){
        document.getElementById("address").value=d.display_name;
      }
    });
  });
}

/* FULL REVERSE GEOCODE WHEN MAP CLICK */
function reverseGeocodeFull(lat,lng){
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
  .then(r=>r.json())
  .then(d=>{
    if(!d.address) return;
    const a=d.address;

    pincode.value=a.postcode||"";
    state.value=a.state||"";
    district.value=a.state_district||a.district||"";
    block.value=a.county||a.suburb||"";
    village.value=a.village||a.town||a.city||"";

    document.getElementById("address").value=d.display_name||"";
  });
}
</script>

</body>
</html>
